    <!-- Google Translate -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,es,zh-CN,zh-TW,vi',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
      
      // Custom language selector function
      function changeLanguage(lang) {
        // For "English", we need to show original
        if (lang === 'en') {
          // Try to restore original language
          var restoreLink = document.querySelector('.goog-te-banner-frame');
          if (restoreLink) {
            var innerDoc = restoreLink.contentDocument || restoreLink.contentWindow.document;
            var restoreButton = innerDoc.querySelector('.goog-te-banner-content button');
            if (restoreButton) restoreButton.click();
          }
          // Fallback: set cookie to remove translation
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=." + window.location.hostname;
          location.reload();
          return;
        }
        
        // Set translation cookie and reload
        var langCode = '/en/' + lang;
        document.cookie = "googtrans=" + langCode + "; path=/;";
        document.cookie = "googtrans=" + langCode + "; path=/; domain=." + window.location.hostname;
        location.reload();
      }
      
      // Make function globally available
      window.changeLanguage = changeLanguage;
    </script>
